<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="left-container">
        <div class="Logo-container">
            <img src="lemon-svgrepo-com.svg" alt="lemon" width="170px">
            <div class="Logo-text">Lemon</div>
        </div>
        <div class="credits">Photo by <a href ="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA">Halie West</a> on <a href="htpps://unsplash.com">Unsplash</a></div>
    </div>
    <div class="right-container">
        <div class="upper">
            <div class="upper-text">
                <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.
                    Sign up <em>now</em> to get started.<br><br>You <em>know</em> you want to </p>
            </div>
        </div>
        <form>
            <div class="middle">
                <p>Let's do This</p>
            <div class="form">
                <div class="first">
                    <label for="first_name">FIRST NAME</label>
                    <input id="first_name" name="first_name" type="text" required>
                </div>
                <div class="last">
                    <label for="last_name">LAST NAME</label>
                    <input id="last_name" name="last_name" type="text" required>
                </div>
                <div class="email">
                    <label for="email">EMAIL</label>
                    <input id="email" name="email" type="email" required>
                </div>
                <div class="Phone">
                    <label for="number">PHONE NUMBER</label>
                    <input id="number" name="number" type="tel" required>
                </div>
                <div class="pwd">
                    <label for="pwd">PASSWORD</label>
                    <input id="pwd" name="pwd" type="password" required>
                </div>
                <div class="cpwd">
                    <label for="cpwd">CONFIRM PASSWORD</label>
                    <input id="cpwd" name="cpwd" type="password" required>
                </div>
            </div>
            </div>
            <div class="lower">
                <button type="submit">Create Account</button>
                <p>Already have an account? <a href="index.html">Log in</a></p>
            </div>
        </form>
        
    </div>

</body>
</html>
